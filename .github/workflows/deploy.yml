# .github/workflows/deploy.yml
name: Deploy modelo ML

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Clonamos el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v2

      # 2) DEBUG: verificamos que los secrets lleguen (temporal)
      - name: Debug credenciales de DockerHub
        run: |
          echo "DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'"
          echo -n "${{ secrets.DOCKER_PASSWORD }}" | wc -c

      # 3) Hacemos login en DockerHub
      - name: Login en DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" \
            | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 4) Construimos y subimos la imagen
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev

      # 5) Escribimos la clave SSH en un fichero protegido
      - name: Escribir clave SSH a archivo
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      # 6) Nos conectamos por SSH y desplegamos en EC2
      - name: Conectarse por SSH al EC2
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ~/.ssh/ec2_key.pem
          script: |
            docker stop mlops-api || true
            docker rm mlops-api   || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev
            docker run -d -p 8000:8000 --name mlops-api ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev
