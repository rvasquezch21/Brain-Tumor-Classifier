name: Deploy modelo ML
on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v2

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" \
              | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev .
          docker push ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev

      - name: Escribir clave SSH a archivo
        run: |
          echo "$SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          SSH_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy en EC2 vía SSH
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ec2_key.pem
          script: |
            docker stop mlops-api || true
            docker rm mlops-api   || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev
            docker run -d -p 8000:8000 --name mlops-api \
                       ${{ secrets.DOCKER_USERNAME }}/mlops-model:dev
